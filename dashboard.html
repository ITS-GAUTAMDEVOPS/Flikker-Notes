<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flikker Notes - Dashboard</title>
    <link rel="stylesheet" href="Styling/common.css">
    <link rel="stylesheet" href="Styling/dashboard.css">
    <link rel="stylesheet" href="Styling/variables.css">
</head>
<body class="dashboard-page">
    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Flikker Notes</h1>
            </div>
            <div class="header-right">
                <button class="search-btn" id="searchBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="menu-btn" id="menuBtn">⋯</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- View Selection with Menu -->
            <div class="view-selector-wrapper">
                <div class="view-selector" id="viewSelector">
                    <button class="view-btn active" data-view="all">All Notes</button>
                    <button class="view-btn" data-view="default">Default Notebook</button>
                    <button class="view-btn" data-view="recent">Recently Notebook</button>
                </div>
                <button class="menu-btn-bar" id="menuBtnBar">⋯</button>
                
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                    <button class="dropdown-item" data-action="grid">Grid View</button>
                    <button class="dropdown-item" data-action="list">List View</button>
                    <button class="dropdown-item" data-action="sort-name">Sort By Name (A-Z)</button>
                    <button class="dropdown-item" data-action="sort-edited">Sort By Latest</button>
                </div>
            </div>

            <!-- Notes Grid/List -->
            <div class="notes-container" id="notesContainer">
                <!-- Notes will be inserted here -->
            </div>

            <!-- Create Button -->
            <button class="create-btn" id="createBtn">+ Create</button>
        </div>

        <!-- To-Dos / Notes Toggle -->
        <div class="bottom-toggle">
            <button class="toggle-btn active" data-type="notes">Notes</button>
            <button class="toggle-btn" data-type="todos">To-Dos</button>
        </div>

        <!-- GitHub Link -->
        <footer class="footer">
            <a href="https://github.com/ITS-GAUTAMDEVOPS" target="_blank">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                https://github.com/ITS-GAUTAMDEVOPS
            </a>
        </footer>
    </div>

    <!-- Modal for Template Selection -->
    <div class="modal" id="templateModal" style="display: none;">
        <div class="modal-content">
            <h2>Choose Your Magical Sheet</h2>
            <div class="templates-grid" id="templatesGrid">
                <!-- Template options will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Hidden file input for images -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <script src="Brain/storage.js"></script>
    <script src="Brain/notes.js"></script>
</body>
</html>
